<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Companheiro GK2</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#2b2934">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;0,800;1,400&family=Grenze+Gotisch:wght@600;700;800&display=swap">
<!-- Page template. scripts/build.py replaces the three markers below: @css with src/css/* (in the order of
     src/manifest.json), @data with the dataset, @js with src/js/*. Edit the sources, never prototype/ or dist/. -->
<!-- @css -->
</head>
<body>

<!-- ===================== DATA (filled by scripts/build.py; schema in scripts/README-build.md) ===================== -->
<script id="gk2-data" type="application/json"><!-- @data --></script>

<!-- ===================== APP SHELL ===================== -->
<header class="top" id="top">
  <div class="wrap top-row">
    <a class="brand" href="#plan" id="brand">
      <svg width="22" height="26" viewBox="0 0 11 13" aria-hidden="true" shape-rendering="crispEdges">
        <rect x="4" y="0" width="3" height="13" fill="var(--gold)"/><rect x="0" y="3" width="11" height="3" fill="var(--gold)"/>
        <rect x="5" y="1" width="1" height="11" fill="var(--accent)"/><rect x="1" y="4" width="9" height="1" fill="var(--accent)"/>
      </svg>
      <span class="brand-name" data-slot="brand"></span>
      <span class="brand-sub" data-slot="tagline"></span>
    </a>
    <nav class="tabs tabs-desk" data-slot="tabs"></nav>
    <div class="top-ctl">
      <div class="theme-seg" role="group" data-slot="theme"></div>
      <button type="button" class="theme-cycle" data-slot="theme-cycle" data-theme-cycle></button>
      <div class="lang" role="group" data-slot="lang"></div>
    </div>
  </div>
  <div class="wrap search-row" data-panel="search"></div>
</header>
<div class="tabs-mob-band"><nav class="wrap tabs" data-slot="tabs"></nav></div>

<main>
  <section class="wrap planner" data-screen="plan">
    <div class="col-goals">
      <section data-slot="planner-top" id="planner-top"></section>
      <div data-panel="goals"></div>
    </div>
    <div class="col-plan">
      <div data-panel="checklist"></div>
      <div data-panel="summary"></div>
      <section data-slot="planner-extra" id="planner-extra"></section>
    </div>
  </section>
  <section class="wrap soon-screen" data-screen="soon" hidden data-panel="soon"></section>
  <!-- other screens (e.g. #changelog) get their <section data-screen> from GK.router.ensureScreens() -->
</main>

<footer class="wrap foot" data-panel="footer"></footer>
<div class="toast" role="status" aria-live="polite" hidden id="toast"></div>

<!-- ===================== MODULES ===================== -->
<!-- @js -->
</body>
</html>
